title = %(lib_name)s

### PyPI ###
audience = Developers
author = Alejandro Velasco
author_email = svelascodimate@wm.edu
copyright = 2025 onwards, %(author)s
description = CodeSmells Library
keywords = nbdev jupyter notebook python
language = English
status = 3
user = WM-SEMERU

